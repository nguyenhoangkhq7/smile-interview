services:
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interview_practice_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
      - ./backend/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-interview_practice_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      FASTAPI_AI_BASE_URL: http://ai-service:8000
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai_service
    restart: always
    env_file:
      - .env
      - ./ai-service/.env
    environment:
      PORT: 8000
      HF_HOME: /root/.cache/huggingface
    ports:
      - "8000:8000"
    volumes:
      - sbert_cache:/root/.cache/huggingface

  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: web_app
    restart: always
    env_file:
      - .env
      - ./web-app/.env.local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8081
    depends_on:
      - backend

volumes:
  postgres_data:
  sbert_cache:
