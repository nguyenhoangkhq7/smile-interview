services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  matching-service:
    build:
      context: ./services/matching-service
      dockerfile: Dockerfile
    container_name: matching_service
    restart: always
    ports:
      - "${MATCHING_SERVICE_PORT}:8081"
    environment:
      # Application
      SERVER_PORT: ${SERVER_PORT}
      # Database
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # AI APIs
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_API_URL: ${LLM_API_URL}
      LLM_MODEL: ${LLM_MODEL}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS}
      OLLAMA_EMBEDDING_URL: ${OLLAMA_EMBEDDING_URL}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL}
      OLLAMA_EMBEDDING_TIMEOUT_SECONDS: ${OLLAMA_EMBEDDING_TIMEOUT_SECONDS}
      # Chunking
      CHUNKING_MAX_TOKENS: ${CHUNKING_MAX_TOKENS}
      CHUNKING_OVERLAP_TOKENS: ${CHUNKING_OVERLAP_TOKENS}
      # Question Bank
      QUESTION_BANK_MAX_TOKENS: ${QUESTION_BANK_MAX_TOKENS}
      QUESTION_BANK_TEMPERATURE: ${QUESTION_BANK_TEMPERATURE}
      QUESTION_BANK_MAX_RETRIES: ${QUESTION_BANK_MAX_RETRIES}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-inference-service:
    build:
      context: ./services/ai-inference-service
      dockerfile: Dockerfile
    container_name: ai_inference_service
    restart: always
    ports:
      - "${AI_INFERENCE_PORT:-9091}:9091"
    environment:
      # Application
      SERVER_PORT: 8080
      # gRPC
      GRPC_SERVER_PORT: 9091
      # AI APIs
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_API_URL: ${LLM_API_URL}
      LLM_MODEL: ${LLM_MODEL}
    # Speaches: OpenAI-compatible STT/TTS server powered by faster-whisper
    # Docs: https://speaches.ai | Repo: https://github.com/fedirz/faster-whisper-server
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: ai_inference_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Force CPU execution (no GPU required)
      WHISPER__INFERENCE_DEVICE: cpu
      # int8 quantization — best latency/quality tradeoff on CPU
      WHISPER__COMPUTE_TYPE: int8
      
      # [TỐI ƯU TỐC ĐỘ 1] Cắt bỏ khoảng lặng (silence) cực kỳ quan trọng
      WHISPER__ENABLE_VAD: "true"
      # [TỐI ƯU TỐC ĐỘ 2] Dùng đa nhân CPU (Thay bằng số nhân thực tế nếu máy bạn mạnh)
      WHISPER__CPU_THREADS: 4
      
      # [ĐÃ SỬA] Thêm tiền tố SPEACHES__ để biến này thực sự có tác dụng
      SPEACHES__STT_MODEL_TTL: -1
    volumes:
      # Persist downloaded HuggingFace models on the host for ubuntu user
      - whisper_models:/home/ubuntu/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  streaming-service:
    build:
      context: ./services/streaming-service
      dockerfile: Dockerfile
    container_name: streaming_service
    restart: always
    ports:
      - "${STREAMING_SERVICE_PORT:-8001}:8001"
    environment:
      PORT: 8001
      REDIS_URL: redis://redis:6379
      WHISPER_API_URL: http://ai-inference-service:8000/v1/audio/transcriptions
      WHISPER_API_KEY: dummy_key_for_local
      # Sử dụng model 'small' để nâng cao độ chính xác nhận diện từ viết tắt & thuật ngữ IT
      WHISPER_MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-small}
      # TTS — OpenAI-compatible /v1/audio/speech endpoint served by Speaches
      TTS_API_URL: http://ai-inference-service:8000/v1/audio/speech
      TTS_MODEL: ${TTS_MODEL:-speaches-ai/piper-vi_VN-vais1000-medium}
    depends_on:
      redis:
        condition: service_healthy
      ai-inference-service:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────
  # Next.js Frontend — 3D Interviewer Avatar
  # ─────────────────────────────────────────────────────────────────
  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: web_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      - streaming-service

volumes:
  postgres_data:
  redis_data:
  # Named volume for HuggingFace model cache — survives container restarts/rebuilds
  whisper_models:
