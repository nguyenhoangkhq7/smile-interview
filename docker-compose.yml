services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smile_interview_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────
  # Backend API — Java 21 Spring Boot Modular Monolith
  # ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_api
    restart: always
    env_file:
      - .env
      - ./backend/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smile_interview_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      FASTAPI_AI_BASE_URL: http://ai-service:8000
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────
  # AI Service — Python FastAPI (CV-JD Matching, GNN, Evaluation)
  # ─────────────────────────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai_service
    restart: always
    env_file:
      - .env
      - ./ai-service/.env
    environment:
      PORT: 8000
      FASTAPI_AI_BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"

  # ─────────────────────────────────────────────────────────────────
  # Next.js Frontend — Web Application (Pure UI Presentation Layer)
  # ─────────────────────────────────────────────────────────────────
  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: web_app
    restart: always
    env_file:
      - .env
      - ./web-app/.env.local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      MATCHING_SERVICE_URL: http://backend:8081
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_API_URL: ${LLM_API_URL}
      LLM_MODEL: ${LLM_MODEL}
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
