name: AI Inference Service CI

on:
  pull_request:
    branches: [ "develop", "main", "master" ]
    paths:
      - 'services/ai-inference-service/**'
      - '.github/workflows/ai-inference-service-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-inference-service
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: services/ai-inference-service/pom.xml
          
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw
        
      - name: Run Unit Tests
        run: ./mvnw test
        
      - name: Run SAST Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'services/ai-inference-service'
          format: 'table'
          exit-code: '1' # Block merge if there are CRITICAL/HIGH vulnerabilities
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          
      - name: Build with Maven (Dry-run)
        run: ./mvnw clean package -DskipTests
