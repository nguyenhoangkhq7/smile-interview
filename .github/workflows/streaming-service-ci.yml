name: Streaming Service CI

on:
  pull_request:
    branches: [ "develop", "main", "master" ]
    paths:
      - 'services/streaming-service/**'
      - '.github/workflows/streaming-service-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/streaming-service
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: services/streaming-service/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Unit Tests
        env:
          NODE_ENV: test
        run: npm test
        
      - name: Run SAST Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'services/streaming-service'
          format: 'table'
          exit-code: '1' # Block merge if there are CRITICAL/HIGH vulnerabilities
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
