name: Web App Frontend CI

on:
  workflow_call:
  pull_request:
    branches: [ "develop", "main", "master" ]

permissions:
  contents: read
jobs:
  build-and-test:
    name: Web checks and scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run ESLint
        run: npm run lint
        
      - name: Run TypeScript typecheck
        run: npx tsc --noEmit
        
      - name: Run SAST Scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: 'web-app'
          format: 'table'
          exit-code: '1' # Block merge if there are CRITICAL/HIGH vulnerabilities
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          
      - name: Build Next.js (Dry-run)
        run: npm run build
