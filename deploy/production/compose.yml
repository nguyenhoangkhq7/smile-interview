services:
  code-runner:
    build: !reset null
    image: ${CODE_RUNNER_IMAGE:?Missing code-runner digest}
    networks: !override [code-execution]
  backend:
    build: !reset null
    env_file: !override
      - path: ../backend/.env
        format: raw
    image: ${BACKEND_IMAGE:?Missing backend digest}
  ai-service:
    build: !reset null
    env_file: !override
      - path: ../ai-service/.env
        format: raw
    image: ${AI_IMAGE:?Missing AI digest}
    environment:
      GNN_REQUIRE_CHECKPOINT: "true"
      CODE_RUNNER_URL: http://code-runner:8090
    networks: [code-execution]

networks:
  code-execution:
    internal: true
