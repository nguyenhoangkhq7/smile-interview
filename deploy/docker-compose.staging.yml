x-logging: &app-logging
  driver: local

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    logging: *app-logging
    mem_limit: 1024m
    cpus: "1.0"
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=80
      - -c
      - wal_buffers=16MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interview_practice_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *app-logging
    mem_limit: 4096m
    cpus: "1.5"
    env_file:
      - ../ai-service/.env
    environment:
      PORT: 8000
      DEBUG: "false"
      ENVIRONMENT: production
      HF_HOME: /app/.cache/huggingface
      GNN_REQUIRE_CHECKPOINT: ${GNN_REQUIRE_CHECKPOINT:-true}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    expose:
      - "8000"
    volumes:
      - sbert_cache:/app/.cache/huggingface
      - type: bind
        source: ${GNN_CHECKPOINT_DIR:-../ai-service/matching_cv/data/checkpoints/paper_aligned_gnn}
        target: /app/matching_cv/data/checkpoints/paper_aligned_gnn
        read_only: true
        bind:
          create_host_path: false
    networks:
      - internal

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *app-logging
    mem_limit: 1280m
    cpus: "1.0"
    env_file:
      - ../backend/.env
    environment:
      JAVA_TOOL_OPTIONS: "-Xms384m -Xmx768m -XX:+UseG1GC"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-interview_practice_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      FASTAPI_AI_BASE_URL: http://ai-service:8000
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?Set exact Vercel staging origin}
      APP_JWT_ALLOW_DEFAULT_SECRET: "false"
      APP_SECURITY_REQUIRE_HARDENED_ADMIN: "true"
    expose:
      - "8081"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *app-logging
    mem_limit: 128m
    cpus: "0.5"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:
  backend_uploads:
  sbert_cache:

networks:
  internal:
    driver: bridge
