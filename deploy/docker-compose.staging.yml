x-logging: &app-logging
  driver: local

services:
  code-runner:
    build:
      context: ../code-runner
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *app-logging
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8090"
    networks:
      - internal

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *app-logging
    mem_limit: 4096m
    cpus: "1.5"
    env_file:
      - ../ai-service/.env
    environment:
      PORT: 8000
      DEBUG: "false"
      ENVIRONMENT: production
      HF_HOME: /app/.cache/huggingface
      GNN_REQUIRE_CHECKPOINT: ${GNN_REQUIRE_CHECKPOINT:-true}
      CODE_RUNNER_URL: ${CODE_RUNNER_URL:-http://code-runner:8090}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    expose:
      - "8000"
    volumes:
      - sbert_cache:/app/.cache/huggingface
      - type: bind
        source: ${GNN_CHECKPOINT_DIR:-../ai-service/matching_cv/data/checkpoints/paper_aligned_gnn}
        target: /app/matching_cv/data/checkpoints/paper_aligned_gnn
        read_only: true
        bind:
          create_host_path: false
    networks:
      - internal

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *app-logging
    mem_limit: 1280m
    cpus: "1.0"
    env_file:
      - ../backend/.env
    environment:
      JAVA_TOOL_OPTIONS: "-Xms384m -Xmx768m -XX:+UseG1GC"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${RDS_ENDPOINT:?Set the RDS endpoint hostname}:5432/${RDS_DB_NAME:-interview_practice_db}?sslmode=verify-full&sslrootcert=/run/rds-ca/rds-global-bundle.pem"
      FASTAPI_AI_BASE_URL: http://ai-service:8000
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?Set exact Vercel staging origin}
      APP_SECURITY_REQUIRE_HARDENED_ADMIN: "true"
    expose:
      - "8081"
    volumes:
      - backend_uploads:/app/uploads
      - type: bind
        source: ${RDS_CA_BUNDLE:-./certs/rds-global-bundle.pem}
        target: /run/rds-ca/rds-global-bundle.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      ai-service:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: nginx:1.30.8-alpine
    restart: unless-stopped
    logging: *app-logging
    mem_limit: 128m
    cpus: "0.5"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

volumes:
  backend_uploads:
  sbert_cache:

networks:
  internal:
    driver: bridge
