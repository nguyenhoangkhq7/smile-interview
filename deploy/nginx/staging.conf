# Replace api-staging.example.com with your real staging API domain before enabling HTTPS.

log_format smile_timing '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        'rt=$request_time urt="$upstream_response_time" '
                        '"$http_referer" "$http_user_agent"';

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=30r/m;
limit_req_status 429;

upstream smile_backend {
    server backend:8081;
    keepalive 16;
}

server {
    listen 80;
    server_name api-staging.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api-staging.example.com;

    ssl_certificate /etc/letsencrypt/live/api-staging.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-staging.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/access.log smile_timing;

    client_max_body_size 55M;

    # Compress standard JSON API payloads (disabled explicitly on streaming routes below)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json text/plain;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Unbuffered streaming routes: Voice PCM TTS and future SSE endpoints
    location ~ ^/api/(v2/sessions/[^/]+/interview/(voice/speech|respond-stream|conversation-stream)|v1/sessions/[^/]+/analyze-gap/[^/]+/events)$ {
        limit_req zone=ai_limit burst=20 nodelay;
        proxy_pass http://smile_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Auth endpoints protected against brute-force attempts
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth_limit burst=15 nodelay;
        proxy_pass http://smile_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    # Cost-sensitive AI / Voice REST endpoints
    location ~ ^/api/(v1/sessions/[^/]+/analyze-gap|v1/matching/compare|v2/sessions/[^/]+/interview/(start|respond|next-question|voice/transcribe|voice/avatar-session))$ {
        limit_req zone=ai_limit burst=20 nodelay;
        proxy_pass http://smile_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Standard REST API routes
    location / {
        proxy_pass http://smile_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
