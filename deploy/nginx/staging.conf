# Replace api-staging.example.com with your real staging API domain before enabling HTTPS.

upstream smile_backend {
    server backend:8081;
    keepalive 16;
}

server {
    listen 80;
    server_name api-staging.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api-staging.example.com;

    ssl_certificate /etc/letsencrypt/live/api-staging.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-staging.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 55M;

    # Unbuffered streaming routes: Voice PCM TTS and future SSE endpoints
    location ~ ^/api/(v2/sessions/[^/]+/interview/(voice/speech|respond-stream|conversation-stream)|v1/sessions/[^/]+/analyze-gap/[^/]+/events)$ {
        proxy_pass http://smile_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Standard REST API routes
    location / {
        proxy_pass http://smile_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 15s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
