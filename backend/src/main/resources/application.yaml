spring:
  task:
    scheduling:
      pool:
        size: 2
  application:
    name: backend-api

  # ============================================================
  # Database — PostgreSQL
  # ============================================================
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # ============================================================
  # Flyway — DB Migration
  # ============================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

  # ============================================================
  # Multipart File Upload (PDF files)
  # ============================================================
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

  # ============================================================
  # Spring MVC Async Timeout
  # ============================================================
  mvc:
    async:
      request-timeout: 300000

server:
  port: ${SERVER_PORT:8081}
  tomcat:
    connection-timeout: 300000
    keep-alive-timeout: 300000

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}

  jwt:
    secret: ${JWT_SECRET:c3VwZXJzZWNyZXRrZXlmb3JkZXZlbG9wbWVudGVudmlyb25tZW50MjU2Yml0cw==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    allow-default-secret: ${APP_JWT_ALLOW_DEFAULT_SECRET:true}

  security:
    require-hardened-admin: ${APP_SECURITY_REQUIRE_HARDENED_ADMIN:false}
    admin-bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}

  ai:
    fastapi:
      base-url: ${FASTAPI_AI_BASE_URL:http://localhost:8000}
      connect-timeout-seconds: ${FASTAPI_AI_CONNECT_TIMEOUT:15}
      read-timeout-seconds: ${FASTAPI_AI_READ_TIMEOUT:180}

logging:
  level:
    fit.iuh: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
