spring:
  application:
    name: matching-service

  # ============================================================
  # Database — PostgreSQL + pgvector
  # ============================================================
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'validate' — Flyway owns the schema; Hibernate only validates entities match the DB
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Register custom Hibernate types (pgvector)
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # ============================================================
  # Flyway — DB Migration
  # ============================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
    clean-disabled: false

  # ============================================================
  # Redis
  # ============================================================
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  # ============================================================
  # Multipart File Upload (PDF files)
  # ============================================================
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

# ============================================================
# Server Port
# ============================================================
server:
  port: ${SERVER_PORT:8081}

# ============================================================
# Smile Interview — Custom Application Properties
# ============================================================
app:
  llm:
    api-key: ${LLM_API_KEY}
    api-url: ${LLM_API_URL:https://api.groq.com}
    chat-path: ${LLM_CHAT_PATH:/openai/v1/chat/completions}
    model: ${LLM_MODEL:llama-3.3-70b-versatile}
    # Timeout in seconds for LLM API calls
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:60}
    # Max tokens in LLM response
    max-tokens: ${LLM_MAX_TOKENS:8192}

  ollama:
    embedding-url: ${OLLAMA_EMBEDDING_URL:http://host.docker.internal:11434}
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding-4b}
    # Timeout in seconds for Ollama API calls
    timeout-seconds: ${OLLAMA_EMBEDDING_TIMEOUT_SECONDS:60}

  chunking:
    # Max tokens per chunk for LangChain4j splitter
    max-tokens: ${CHUNKING_MAX_TOKENS:512}
    # Token overlap between consecutive chunks
    overlap-tokens: ${CHUNKING_OVERLAP_TOKENS:150}

  question-bank:
    max-tokens: ${QUESTION_BANK_MAX_TOKENS:8192}
    temperature: ${QUESTION_BANK_TEMPERATURE:0.4}
    max-retries: ${QUESTION_BANK_MAX_RETRIES:2}

  # ============================================================
  # JWT Authentication
  # ============================================================
  jwt:
    # Base64-encoded HMAC-SHA256 key (≥ 256 bits).
    # Override in production via JWT_SECRET env variable.
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    # Token expiry in milliseconds (default: 24 hours)
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# ============================================================
# Logging
# ============================================================
logging:
  level:
    fit.iuh: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
