spring:
  application:
    name: ai-inference-service
  threads:
    virtual:
      enabled: true

openrouter:
  api-key: ${LLM_API_KEY:${OPENROUTER_API_KEY:mock-key}}
  base-url: ${LLM_API_URL:${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}}
  fallback-models: ${LLM_FALLBACK_MODELS:poolside/laguna-xs-2.1:free,poolside/laguna-xs-2.1}
  model:
    evaluation: ${LLM_MODEL_REALTIME_EVALUATION:${OPENROUTER_EVAL_MODEL:${LLM_MODEL:google/gemini-2.0-flash-001}}}
    final-report: ${LLM_MODEL_FINAL_REPORT:${OPENROUTER_FINAL_REPORT_MODEL:${LLM_MODEL:google/gemini-2.0-flash-001}}}

llm:
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:60}
  final-report-timeout-seconds: ${LLM_FINAL_REPORT_TIMEOUT_SECONDS:180}
  max-retries: ${LLM_MAX_RETRIES:2}
  retry-backoff-ms: ${LLM_RETRY_BACKOFF_MS:1000}
  max-cv-length: ${LLM_MAX_CV_LENGTH:8000}
  max-jd-length: ${LLM_MAX_JD_LENGTH:8000}
  max-answer-length: ${LLM_MAX_ANSWER_LENGTH:4000}

grpc:
  server:
    port: 9091
    security:
      enabled: false
