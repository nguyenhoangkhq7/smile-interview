spring:
  application:
    name: ai-inference-service
  threads:
    virtual:
      enabled: true

openrouter:
  api-key: ${OPENROUTER_API_KEY:mock-key}
  base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
  model:
    evaluation: ${OPENROUTER_EVAL_MODEL:google/gemini-2.5-flash}
    final-report: ${OPENROUTER_FINAL_REPORT_MODEL:google/gemini-2.5-flash}

llm:
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:20}
  final-report-timeout-seconds: ${LLM_FINAL_REPORT_TIMEOUT_SECONDS:60}

grpc:
  server:
    port: 9091
    security:
      enabled: false
